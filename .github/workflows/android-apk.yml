name: Android APK

on:
  push:
    branches: [main, 'claude/**']
    # Docs and tooling-only changes must not ship a new APK (it would prompt
    # an update with nothing new in it).
    paths-ignore:
      - 'README.md'
      - 'AGENTS.md'
      - '.github/workflows/check-sources.yml'
      - '.github/workflows/gamedata.yml'
      - '.github/workflows/peek-*.yml'
      - 'scripts/check-sources.ts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Becomes the Android versionCode; the app compares it with version.json.
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: npm ci

      # Freshest community game data (items, quests, workshop...) in the APK.
      - name: Update game data
        run: |
          git clone --depth 1 https://github.com/fgrzesiak/arcraiders-data.git /tmp/arcdata
          node scripts/build-gamedata.ts /tmp/arcdata

      - run: npm test
      - run: npx expo prebuild --platform android --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      # Never publish an APK that crashes on launch: once installed, a broken
      # build cannot update itself. Install it on an emulator and make sure
      # the app is still running after start-up.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Launch test on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/release/app-release.apk
            adb shell monkey -p com.arcevents.app -c android.intent.category.LAUNCHER 1
            sleep 25
            adb shell pidof com.arcevents.app || (echo "::error::App crashed on launch"; adb logcat -d -b crash; adb logcat -d -s ReactNativeJS:E AndroidRuntime:E; exit 1)

      - name: Write version.json
        run: |
          node -e '
            const version = require("./app.json").expo.version;
            const notes = JSON.parse(require("child_process").execSync("node scripts/release-notes.ts").toString());
            require("fs").writeFileSync("version.json", JSON.stringify({ buildNumber: Number(process.env.BUILD_NUMBER), version, notes, commit: process.env.GITHUB_SHA }));
          '
          cat version.json

      # Published as a GitHub release so the APK can be downloaded and
      # installed straight from a phone browser (no zip to extract).
      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          name: ARC Events (dernière version)
          body: "Dernière version de l'app (build ${{ github.run_number }}). Télécharge le fichier .apk depuis ton téléphone Android pour l'installer ; ensuite l'app se met à jour toute seule."
          prerelease: true
          make_latest: false
          files: android/app/build/outputs/apk/release/app-release.apk

      # Uploaded after the APK: the app only offers the update once it exists.
      - name: Publish version.json
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-latest
          files: |
            version.json
            src/data/gamedata.json
