name: Launch APK in emulator

# Installs the published APK on an Android emulator, launches it and prints
# the crash log, to debug start-up crashes without a device.
on:
  push:
    paths: ['.github/workflows/crash-test.yml']
  workflow_dispatch:

jobs:
  launch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: curl -sSL -o app.apk https://github.com/Jeenius1121/Arc/releases/download/apk-latest/app-release.apk
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: |
            adb install -r app.apk
            adb logcat -c
            adb shell monkey -p com.arcevents.app -c android.intent.category.LAUNCHER 1
            sleep 20
            adb shell pidof com.arcevents.app || echo "APP NOT RUNNING"
            adb logcat -d -b crash > crash.txt || true
            adb logcat -d '*:E' > errors.txt || true
            echo "===== CRASH BUFFER"; cat crash.txt | head -150
            echo "===== ERRORS (app related)"; grep -iE "arcevents|ReactNative|AndroidRuntime|FATAL|Exception|ReactNativeJS" errors.txt | head -150
