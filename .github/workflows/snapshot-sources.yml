name: Snapshot data sources

# Downloads the raw schedule sources so their real format can be inspected
# while developing the parsers (the dev environment cannot reach them).
on:
  push:
    paths: ['.github/workflows/snapshot-sources.yml']
  workflow_dispatch:

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - name: Download sources
        run: |
          mkdir out && cd out
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36"
          fetch() { curl -sSL -m 60 -A "$UA" -H "Accept-Language: fr-FR,fr;q=0.9" -D "$1.headers" -o "$1" "$2" || true; }
          fetch metaforge-event-timers.json https://metaforge.app/api/arc-raiders/event-timers
          fetch metaforge-events-schedule.json https://metaforge.app/api/arc-raiders/events-schedule
          fetch metaforge-page.html https://metaforge.app/arc-raiders/event-timers
          fetch official.html https://arcraiders.com/map-conditions
          fetch official-fr.html https://arcraiders.com/fr/map-conditions
          date -u > fetched-at.txt
          ls -la
      - name: Print sources
        working-directory: out
        run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36"
          echo "=== MetaForge summary"
          jq -c '{keys: keys, region, cachedAt, count: (.data|length), first: .data[0:3]}' metaforge-event-timers.json || head -c 2000 metaforge-event-timers.json
          for r in europe eu na us america asia oce; do
            echo "=== MetaForge ?region=$r"
            curl -sS -m 30 -A "$UA" "https://metaforge.app/api/arc-raiders/event-timers?region=$r" | jq -c '{region, count: (.data|length), first: .data[0:2]}' 2>&1 | head -c 1500; echo
          done
          for c in "NEXT_LOCALE=fr" "locale=fr"; do
            curl -sS -m 30 -A "$UA" -H "Cookie: $c" -H "Accept-Language: fr-FR" -o "official-cookie-$c.html" https://arcraiders.com/fr/map-conditions || true
            echo "=== cookie $c: $(wc -c < "official-cookie-$c.html") bytes"
            grep -oE 'conditionName__[a-zA-Z0-9]+">[^<]+' "official-cookie-$c.html" | sort -u | head -20
          done
          echo "=== Official liveEntries + region strings"
          python3 - official.html <<'PY'
          import json, re, sys
          html = open(sys.argv[1], encoding='utf-8').read()
          flight = ''.join(json.loads(m.group(1)) for m in re.finditer(r'self\.__next_f\.push\(\[\d+,("(?:[^"\\]|\\.)*")\]\)', html))
          i = flight.index('"liveEntries":') + len('"liveEntries":')
          entries, _ = json.JSONDecoder().raw_decode(flight[i:])
          print('entries', len(entries))
          print(json.dumps(entries[:2]))
          print(sorted({e['mapDisplayName'] for e in entries}))
          print(sorted({e['conditionName'] for e in entries}))
          for m in re.finditer(r'(?i)europe|north-america|regionOptions|"regions"', flight):
              print('...', flight[max(0, m.start() - 200): m.start() + 300].replace('\n', ' '))
              break
          for m in list(re.finditer(r'(?i)europe', flight))[:3]:
              print('EU>', flight[max(0, m.start() - 300): m.start() + 300].replace('\n', ' '))
          PY
          echo "=== Official RSC payload around the conditions"
          python3 - official-fr.html <<'PY'
          import json, re, sys
          html = open(sys.argv[1], encoding='utf-8').read()
          chunks = []
          for m in re.finditer(r'self\.__next_f\.push\(\[\d+,("(?:[^"\\]|\\.)*")\]\)', html):
              try: chunks.append(json.loads(m.group(1)))
              except Exception: pass
          flight = ''.join(chunks)
          print('flight length', len(flight))
          for key in ['conditionItems', 'currentCondition', 'region', 'Redirection', 'startTime', 'startsAt']:
              for m in list(re.finditer(key, flight))[:2]:
                  print('---', key, m.start())
                  print(flight[max(0, m.start() - 600): m.start() + 2500])
          PY
          echo "=== Official HTML visible text sample"
          python3 - official-fr.html <<'PY'
          import re, sys
          html = open(sys.argv[1], encoding='utf-8').read()
          body = re.sub(r'<script[\s\S]*?</script>', '', html)
          i = body.find('map-condition-list_list')
          print(re.sub(r'\s+', ' ', body[i:i + 6000]))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: sources
          path: out/
