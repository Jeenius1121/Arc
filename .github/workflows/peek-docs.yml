name: Peek ARC Tracker API docs

on:
  push:
    paths: ['.github/workflows/peek-docs.yml']

jobs:
  peek:
    runs-on: ubuntu-latest
    steps:
      - run: |
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Safari/537.36"
          curl -sSL -m 60 -A "$UA" -o docs.html https://arctracker.io/developers/docs
          curl -sSL -m 60 -A "$UA" -o app.html https://arctracker.io/app
          python3 - <<'PY'
          import re, html, json
          for f in ('docs.html', 'app.html'):
              t = open(f, encoding='utf-8', errors='replace').read()
              flight = ''
              for m in re.finditer(r'self\.__next_f\.push\(\[\d+,("(?:[^"\\]|\\.)*")\]\)', t):
                  try: flight += json.loads(m.group(1))
                  except Exception: pass
              body = re.sub(r'<script[\s\S]*?</script>|<style[\s\S]*?</style>|<svg[\s\S]*?</svg>', ' ', t)
              words = [html.unescape(s).strip() for s in re.split(r'<[^>]+>', body)]
              out = []
              for w in words:
                  if len(w) > 1 and (not out or out[-1] != w): out.append(w)
              print('=====', f, len(t))
              print('\n'.join(out)[:14000])
              for m in sorted(set(re.findall(r'/api/v2/[a-zA-Z0-9/_{}:-]+', t + flight))):
                  print('ENDPOINT', m)
              for m in sorted(set(re.findall(r'"(?:read|write):[a-z_:]+"|scope[s]?[^,]{0,80}', flight)))[:60]:
                  print('SCOPE', m)
          PY
