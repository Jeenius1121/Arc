name: Check data sources

on:
  push:
    paths: ['src/core/**', 'scripts/check-sources.ts', '.github/workflows/check-sources.yml']
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/check-sources.ts
