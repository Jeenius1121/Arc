name: Extract condition icons

on:
  push:
    paths: ['.github/workflows/peek-conditions.yml']

permissions:
  contents: write

jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0 Mobile Safari/537.36"
          curl -sSL -m 60 -A "$UA" -o /tmp/main.html https://arcraiders.com/map-conditions
          python3 - <<'PY'
          import re, json
          main = open('/tmp/main.html', encoding='utf-8').read()
          icons = {}
          for m in re.finditer(r'href="/(?:[a-z-]+/)?map-conditions/([a-z0-9-]+)"[^>]*>([\s\S]*?)</a>', main):
              slug, inner = m.group(1), m.group(2)
              svg = re.search(r'<svg[\s\S]*?</svg>', inner)
              if svg and slug not in icons:
                  s = re.sub(r'\s(class|data-name)="[^"]*"', '', svg.group(0))
                  icons[slug] = s
          print(sorted(icons))
          json.dump(icons, open('src/core/conditionIcons.json', 'w'), indent=1, sort_keys=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/core/conditionIcons.json
          git commit -m "Add official condition icons (extracted from arcraiders.com)"
          git push
