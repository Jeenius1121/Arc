<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Tracker — Raider Companion</title>
  <meta name="description" content="Tracker : choisis l'objet qu'il te manque dans ARC Raiders (matériau, schéma, arme) et obtiens la meilleure carte, les zones, l'itinéraire et les étapes. Application de fans, non officielle." />
  <meta name="theme-color" content="#0c0d0f" />
  <meta name="color-scheme" content="dark" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Tracker" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" type="image/svg+xml" href="assets/icons/icon.svg" />
  <link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
  <link rel="preload" href="assets/fonts/chakra-petch-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="data/db.json" as="fetch" crossorigin />
  <link rel="stylesheet" href="assets/css/app.css" />
</head>
<body>
  <div id="update-banner" class="update-banner" role="status" aria-live="polite">
    <div class="wrap">
      <button class="ub-main"><span class="ub-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="m5 12 7-7 7 7"/></svg></span><span class="ub-txt"></span></button>
      <span class="ub-go" aria-hidden="true">Mettre à jour</span>
      <button class="ub-x" aria-label="Plus tard"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    </div>
  </div>
  <div id="app"></div>
  <div id="toasts" class="toast-zone"></div>
  <noscript><p style="padding:20px;color:#efe7d6">Tracker a besoin de JavaScript.</p></noscript>
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
